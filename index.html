
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Cat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #cat-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>

  <img id="cat-image" alt="Random cat">

  <script>
    async function getCat() {
      const catImage = document.getElementById('cat-image');

      try {
        const response = await fetch(
          'https://api.thecatapi.com/v1/images/search?t=' + Date.now()
        );

        if (!response.ok) throw new Error('API error');

        const data = await response.json();

        if (!data[0]?.url) throw new Error('No cat found');

        catImage.src = data[0].url;

      } catch (error) {
        console.error('Could not load a cat:', error);
      }
    }

    // Load a new random cat every time the page opens or refreshes
    getCat();
  </script>

</body>
</html>
